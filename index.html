<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holditly · 2-minute quiz</title>
<meta name="description" content="Take the 2-minute quiz and see how much your impulse buys could put toward your goal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1C1B19; --muted:#6B675F; --line:#E6E0D6;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E4EFE8; --warn:#C2410C; --warn-soft:#F6D9C9; --hi:#F2C14E; --hi-soft:#FBF0D2;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;height:44px}
.logo{font-weight:500;font-size:18px;letter-spacing:-.01em}.logo b{font-weight:700}
.back,.close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;visibility:hidden;color:var(--muted)}
.back.on,.close.on{visibility:visible}.back:hover,.close:hover{background:var(--line)}
.close{margin-left:auto}
.bar{height:4px;background:var(--line);border-radius:4px;margin:8px 0 24px;overflow:hidden}
.bar.off{visibility:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s ease}
main{flex:1;display:flex;flex-direction:column}
h1,h2{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;line-height:1.15}
h1{font-size:34px}h2{font-size:26px;margin-bottom:8px}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;font-size:16px;font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:#cfc6b8}.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .em{font-size:22px;width:28px;text-align:center}
.opt .chk{margin-left:auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;flex:none}
.opt.sel .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:14px;font-weight:600;line-height:1.3;transition:border-color .15s,background .15s,transform .1s;position:relative}
.pic:active{transform:scale(.98)}
.pic svg{width:72px;height:72px}
.pic.sel{border-color:var(--accent);background:var(--accent-soft)}
.pic.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px}
.pic.wide svg{width:48px;height:48px}
.pic .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);font-size:12px;color:transparent;display:grid;place-items:center;background:#fff}
.pic.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;line-height:1.25;text-align:center;transition:border-color .15s,background .15s}
.tile .e{font-size:34px;line-height:1}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.likert button{aspect-ratio:1;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:18px;font-weight:600}
.likert button.sel{border-color:var(--accent);background:var(--accent-soft)}
.lk-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.quote{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.3;margin:8px 0 16px}
.cta{margin-top:auto;padding-top:24px}
.btn{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:17px;font-size:17px;font-weight:600;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.99)}.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.dark{background:#000;color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{display:block;margin:14px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.fine{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;font:inherit;font-size:17px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.tl{display:flex;gap:4px;margin:4px 0}
.tl span{flex:1;height:34px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
.tl span.urge{background:var(--warn-soft);color:var(--warn)}.tl span.end{background:var(--accent);color:#fff}
.load{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.lrow .lt{display:flex;justify-content:space-between;font-size:15px;font-weight:500;margin-bottom:8px}
.lrow .lb{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.lrow .lb i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px}
.fact{margin-top:28px;min-height:150px}
.fact .card{animation:f .4s ease}
.fact small{display:block;color:var(--muted);font-size:12px;margin-top:10px}
.big{font-family:Fraunces,Georgia,serif;font-size:52px;line-height:1;color:var(--accent);letter-spacing:-.03em}
.huge{font-family:Fraunces,Georgia,serif;font-size:72px;line-height:1;color:var(--accent);letter-spacing:-.03em}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:6px 10px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
.tag.hi{background:var(--hi-soft);color:#7a5a06}
.chart{margin:16px 0 4px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.pts li{list-style:none;display:flex;gap:10px;font-size:15px;line-height:1.45}
.pts li b{color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0 6px}
.people i{aspect-ratio:1;border-radius:50%;background:var(--line);transform:scale(.4);opacity:0;transition:transform .3s,opacity .3s,background .3s}
.people i.on{transform:scale(1);opacity:1}.people i.hit{background:var(--accent)}
.persona-q{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.35}
.persona-q small{display:block;font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin-top:8px}
.sci{display:flex;gap:12px;align-items:flex-start}
.sci .ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:15px;font-weight:700}
.sci p{font-size:14px;line-height:1.5}.sci small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.plans{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.plan{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 16px;width:100%}
.plan.sel{border-color:var(--accent);background:var(--accent-soft)}
.plan .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.plan.sel .rad{border:7px solid var(--accent)}
.plan .pn{font-weight:600;font-size:16px}.plan .pd{font-size:13px;color:var(--muted);margin-top:2px}
.plan .pp{margin-left:auto;text-align:right}.plan .pp b{font-size:20px}.plan .pp small{display:block;font-size:12px;color:var(--muted)}
.badge{position:absolute;top:-11px;left:16px;background:var(--hi);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.me{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-top:4px}
.me-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.me-row span{color:var(--muted)}.me-row b{text-align:right}
.trust{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:10px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.terms{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px;text-align:left}
.faq{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.faq h3{font-size:15px;margin-bottom:4px}
.faq details{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.faq summary{font-weight:600;cursor:pointer;font-size:15px}.faq p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px}
.tst{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.tst .card{padding:16px}.tst p{font-size:15px;line-height:1.45}.tst small{display:block;color:var(--muted);font-size:13px;margin-top:8px}
.stars{color:#D9A21B;letter-spacing:2px;font-size:14px;margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(28,27,25,.5);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.overlay .card{max-width:520px;width:100%;padding:24px;border:0;animation:f .3s ease}
@media(min-width:560px){.overlay{align-items:center}}
.ds{background:var(--accent);color:#fff;border-radius:24px;padding:28px 22px;text-align:center;margin-top:8px}
.ds h2{color:#fff;font-size:30px}
.ds .off{font-family:Fraunces,Georgia,serif;font-size:88px;line-height:1;margin:10px 0 4px;color:var(--hi)}
.ds p{opacity:.9;line-height:1.5}
.ds .price{background:rgba(255,255,255,.12);border-radius:16px;padding:14px;margin:18px 0 6px}
.ds .price s{opacity:.7}
.up{background:var(--card);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;margin-top:8px}
.up .hero{background:var(--hi-soft);padding:24px;display:grid;place-items:center}
.up .body{padding:20px}
.check{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.check li{list-style:none;display:flex;gap:10px;font-size:15px;line-height:1.45}.check li:before{content:"✓";color:var(--accent);font-weight:700}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;margin:16px 0}
.steps li{list-style:none;display:flex;gap:12px;font-size:15px;line-height:1.45}
.steps li:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.pts li .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.rating{display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;color:var(--muted)}
.rating b{color:var(--ink);font-size:15px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.tst .card{display:flex;gap:12px;align-items:flex-start}
.hero-art{display:flex;justify-content:center;margin:4px 0 14px}.hero-art svg{width:110px;height:110px}
.restart{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:15px;background:var(--card)}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =========================================================
   CONFIG: edit here, then deploy
   ========================================================= */
const CONFIG = {
  META_PIXEL_ID: '1147565131061927',        // e.g. '123456789012345'
  GA4_ID: '',               // e.g. 'G-XXXXXXXXXX'
  PRICE_YEAR: 39.99,

  DOWNSELL_PRICE_YEAR: 19.99,  // first year, shown when someone closes the paywall

  // DEMO social proof for the portfolio version (sample users, rating, reviews).
  // These numbers and reviews are illustrative, not real. Set to false before any real traffic or ads.
  DEMO_PROOF: false,
  DEMO_USERS: '250,000+',
  DEMO_RATING: '4.8',
  DEMO_RATINGS_COUNT: '12,400',
  DEMO_TESTIMONIALS: [
    { text:'Held 9 things in October, bought 2. That\'s $310 in my Lisbon fund instead of my closet.', name:'Sara, 28', meta:'Late-night scroller' },
    { text:'The day-7 check-in is weirdly freeing. Half the time I don\'t even remember what I wanted.', name:'Jordan, 34', meta:'Deal hunter' },
    { text:'No bank login, no budget, no guilt. Just a pause. My emergency fund finally grew.', name:'Priya, 31', meta:'Mood shopper' }
  ]
};

/* ---------- Analytics ---------- */
(function initAnalytics(){
  if (CONFIG.META_PIXEL_ID){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', CONFIG.META_PIXEL_ID); fbq('track','PageView');
  }
  if (CONFIG.GA4_ID){
    const s=document.createElement('script'); s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+CONFIG.GA4_ID; document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments)}; gtag('js',new Date()); gtag('config',CONFIG.GA4_ID);
  }
})();
const META_STD = { lead:'Lead', paywall_view:'ViewContent', begin_checkout:'InitiateCheckout' };
const META_CUSTOM = { quiz_start:'QuizStart', quiz_complete:'QuizComplete', quiz_step:'QuizStep', plan_select:'PlanSelect',
  downsell_view:'DownsellView', downsell_accept:'DownsellAccept', upsell_view:'UpsellView', upsell_accept:'UpsellAccept', exit_intent:'ExitIntent' };
window._events = [];
function track(name, params={}){
  const p = Object.assign({ variant: S.variant, persona: S.persona || undefined }, utm, params);
  window._events.push({name, ...p});
  try{ if(window.fbq){ if(META_STD[name]) fbq('track', META_STD[name], p); else if(META_CUSTOM[name]) fbq('trackCustom', META_CUSTOM[name], p); } }catch(e){}
  try{ if(window.gtag) gtag('event', name, p); }catch(e){}
  if (location.search.includes('debug')) console.log('[track]', name, p);
}

/* ---------- UTM + A/B variant ---------- */
const qs = new URLSearchParams(location.search);
const utm = {};
['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>{ if(qs.get(k)) utm[k]=qs.get(k); });
function pickVariant(){
  const forced = qs.get('v'); if (forced==='a'||forced==='b') return forced;
  try{ const saved = localStorage.getItem('hl_v'); if (saved) return saved; }catch(e){}
  const v = Math.random()<0.5 ? 'a' : 'b';
  try{ localStorage.setItem('hl_v', v); }catch(e){}
  return v;
}
/* A/B test on the result screen: a = money framing, b = time-to-goal framing */

const S = { i:0, a:{}, variant: pickVariant(), persona:null, plan:'year', email:'', name:'' };

/* ---------- Illustrations (inline SVG, brand colors) ---------- */
const G='#2F6B4F', GS='#E4EFE8', Y='#F2C14E', YS='#FBF0D2', O='#C2410C', OS='#F6D9C9', K='#1C1B19', L='#E6E0D6';
const ART = {
  night:`<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="34" fill="#E8E6F4"/><path d="M50 14a12 12 0 1 0 8 20 14 14 0 0 1-8-20z" fill="${Y}"/><rect x="22" y="22" width="22" height="38" rx="4" fill="${K}"/><rect x="25" y="26" width="16" height="26" rx="2" fill="#6F7DB8"/><rect x="28" y="40" width="10" height="7" rx="1.5" fill="${Y}"/><circle cx="33" cy="56" r="1.6" fill="#555"/></svg>`,

const $ = s=>document.querySelector(s);

const money = n => '$' + Math.round(n).toLocaleString('en-US');
const perDay = (p, days) => '$' + (p/days).toFixed(2);

function when(m){ return m>24 ? (Math.round(m/6)/2)+' years' : m+' months'; }
function calc(){
  const f = S.a.freq ?? 4, p = S.a.price ?? 38, r = S.a.regret ?? 0.3;
  const year = f*p*r*12, goal = S.a.amount || 1500;
  const months = year>0 ? Math.max(1, Math.ceil(goal/(year/12))) : null;
  return { year, month: year/12, goal, months };
}
function topCats(){
  const c=(S.a.what||[]).map(k=>CAT[k]).filter(Boolean);
  if(!c.length) return 'impulse buys';
  return c.length===1 ? c[0] : c.slice(0,-1).slice(0,2).join(', ') + ' and ' + c[c.length-1];
}
function countUp(el, to, fmt, ms=900){
  const t0=performance.now();
  const step=t=>{ const k=Math.min(1,(t-t0)/ms); const e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setChrome(){
  const s=STEPS[S.i];
  const inQuiz = S.i<QUIZ_END;
  // front-loaded progress: moves fast early, slower later
  let pct = 0;
  if (inQuiz){ const t=(S.i+1)/QUIZ_END; pct = Math.round(100*(1-Math.pow(1-t,2.2))*0.92); }
  else if (s.type==='load') pct=96; else if (s.type==='result'||s.type==='email') pct=100;
  $('#bar').style.width=pct+'%';
  $('#barwrap').classList.toggle('off', !(inQuiz || ['load','result','email'].includes(s.type)));
  $('#back').classList.toggle('on', inQuiz && S.i>0);
  $('#close').classList.toggle('on', s.type==='paywall');
}
function go(id){ S.i = typeof id==='number' ? id : idx(id); render(); window.scrollTo(0,0); }
function next(){ go(S.i+1); }
$('#back').onclick = ()=>{ let j=S.i-1; while(j>0 && ['mirror','timing','science'].includes(STEPS[j].type)) j--; go(j); };
$('#close').onclick = ()=>{ exitShown=true; go('downsell'); };

function overlay(html){ $('#ovc').innerHTML=html; $('#ov').classList.add('on'); }

function proofBlock(n=2, withRating=false){

R.load = (s, box)=>{

  const facts=[FACTS.impulse81, FACTS.week77, FACTS.gap];
  const popups=[
    { at:[0,55], id:'homescreen', q:'Quick one while we work: are shopping apps on your phone\'s home screen?' },
    { at:[1,55], id:'freeship', q:'Have you ever added something just to get free shipping?' }

    <div class="fact" id="fact"></div>`);
  const cards=[]; facts.forEach((F,i)=>{ cards.push(`<div class="card"><div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px">DID YOU KNOW</div><div style="font-size:15px;line-height:1.5">${F.text}</div><small>${F.src}</small></div>`); if(CONFIG.DEMO_PROOF && CONFIG.DEMO_TESTIMONIALS[i]) cards.push(`<div class="tst" style="margin:0">${tCard(CONFIG.DEMO_TESTIMONIALS[i],i)}</div>`); });
  let fi=0; const showFact=()=>{ $('#fact') && ($('#fact').innerHTML=cards[fi%cards.length]); fi++; };
  showFact(); const ft=setInterval(showFact, 3200);
  let paused=false;
  const ask=(p, resume)=>{
    paused=true;
    overlay(`<div class="tag">Quick question</div><h2 style="font-size:22px">${p.q}</h2><div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" data-v="no">No</button><button class="btn" data-v="yes">Yes</button></div>`);
    $('#ovc').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.a[p.id]=b.dataset.v; closeOverlay(); paused=false; resume(); });
  };
  const runRow=(r)=>{
    if(r>=rows.length){ clearInterval(ft); setTimeout(next,500); return; }
    let p=0; const pending=popups.filter(x=>x.at[0]===r);
    const t=setInterval(()=>{
      if(paused) return;
      p=Math.min(100,p+2.5+Math.random()*4);
      const pp=pending.find(x=>!x.done && p>=x.at[1]);
      if(pp){ pp.done=true; ask(pp, ()=>{}); }
      $('#lb'+r).style.width=p+'%'; $('#lp'+r).textContent=Math.round(p)+'%';
      if(p>=100){ clearInterval(t); setTimeout(()=>runRow(r+1),200); }
    },70);
  };
  runRow(0);
};

function chartSVG(year, goal){
  const W=320,H=150,pad=8,m=12; const showGoal = goal<=year*2; const mx=(showGoal?Math.max(goal,year):year)*1.08;
  const x=i=>pad+(W-2*pad)*i/m, y=v=>H-pad-(H-2*pad)*v/mx;
  const pts=[...Array(m+1)].map((_,i)=>`${x(i)},${y(year*i/m)}`).join(' ');
  const gy=y(goal), hit=year>=goal?Math.ceil(goal/(year/12)):null;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Projected money kept over 12 months">
    ${showGoal?`<line x1="${pad}" x2="${W-pad}" y1="${gy}" y2="${gy}" stroke="${Y}" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="${W-pad}" y="${gy-6}" text-anchor="end" font-size="11" fill="#6B675F">Goal ${money(goal)}</text>`:`<text x="${W-pad}" y="${H-22}" text-anchor="end" font-size="11" fill="#6B675F">${money(year)} kept in year one</text>`}
    <polyline points="${x(0)},${y(0)} ${x(m)},${y(0)}" fill="none" stroke="#cfc6b8" stroke-width="3"/>
    <polyline points="${pts}" fill="none" stroke="${G}" stroke-width="3" stroke-linecap="round"/>
    ${hit?`<circle cx="${x(hit)}" cy="${gy}" r="5" fill="${G}"/>`:''}
    <text x="${pad}" y="${H-1}" font-size="10" fill="#6B675F">Now</text>
    <text x="${W-pad}" y="${H-1}" text-anchor="end" font-size="10" fill="#6B675F">12 months</text></svg>`;
}
function personalLines(){

}

      <li><span>Sign in with the same email. Your hold plan and ${gl.n} goal are already set up.</span></li>
      <li><span>Add your first hold. We'll check back on day 7.</span></li>
    </ol>
    <div class="card" style="font-size:14px;line-height:1.5">Questions? Write to <b>${CONFIG.SUPPORT_EMAIL}</b>. A real person answers.</div>
    <button class="restart" data-restart>↻ Take the quiz again</button>`);
};

function restart(){
  closeOverlay();
  Object.assign(S, { i:0, a:{}, persona:null, plan:'year', email:'', name:'', started:false, upsell:false });
  render(); window.scrollTo(0,0);
}
document.addEventListener('click', e=>{ if(e.target.closest('[data-restart]')) restart(); });

/* ---------- Exit intent on the paywall (shown once) ---------- */
// Mobile: catch the browser Back button. Desktop: cursor leaving through the top of the window.
let exitShown=false, exitArmed=false;
function onPaywall(){ return STEPS[S.i] && STEPS[S.i].type==='paywall'; }
function triggerExit(source){
  if(exitShown || !onPaywall() || $('#ov').classList.contains('on')) return false;
  exitShown=true; track('exit_intent',{ source }); go('downsell'); return true;
}
const _render = render;
render = function(){
  _render();
  if(onPaywall() && !exitArmed && !exitShown){ exitArmed=true; try{ history.pushState({hl:'paywall'}, ''); }catch(e){} }
};
window.addEventListener('popstate', ()=>{ if(exitArmed && !exitShown && onPaywall()) triggerExit('back_button'); });
document.addEventListener('mouseout', e=>{ if(!e.relatedTarget && e.clientY<=0) triggerExit('mouse_leave'); });

render();
</script>
</body>
</html>
